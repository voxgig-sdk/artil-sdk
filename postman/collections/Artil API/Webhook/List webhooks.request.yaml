$kind: http-request
id: aebe6fed-8442-5702-9523-5579523d0ed8
description: |-
  The `list` operation of **webhook**.

  SDK: `client.Webhook().list({ agent_id: "example" })`
url: "{{base}}/agents/:id/webhooks"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this webhook belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("webhook_id")) pm.collectionVariables.set("webhook_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
