$kind: http-request
id: b72da3b2-a28e-5b65-8453-ab52fa26f85c
description: |-
  The `create` operation of **webhook**.

  SDK: `client.Webhook().create({ agent_id: "example", url: "example" })`
url: "{{base}}/agents/:id/webhooks"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this webhook belongs to.
body:
  type: json
  content: |-
    {
      "url": "https://example.com",
      "bearerToken": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("webhook_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
