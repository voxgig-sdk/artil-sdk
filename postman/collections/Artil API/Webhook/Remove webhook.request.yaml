$kind: http-request
id: "2e120c24-d8e2-5695-bcfd-49638a5b82a9"
description: |-
  The `remove` operation of **webhook**.

  SDK: `client.Webhook().remove({ agent_id: "example", id: "example_id" })`
url: "{{base}}/agents/:id/webhooks/:webhookId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this webhook belongs to.
  - key: webhookId
    value: "{{webhook_id}}"
    description: The webhook this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("webhook_id")
      }
    language: text/javascript
order: 3000
