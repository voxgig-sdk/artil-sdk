$kind: http-request
id: "75c06c1c-b624-51de-aaa2-db5b520bcb32"
description: |-
  The `list` operation of **client**.

  SDK: `client.Client().list({ agent_id: "example" })`
url: "{{base}}/agents/:id/clients"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this client belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("client_id")) pm.collectionVariables.set("client_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
