$kind: http-request
id: "8d596d3a-683f-5be1-bfba-49e1bc71b761"
description: |-
  The `list` operation of **agent**.

  SDK: `client.Agent().list()`
url: "{{base}}/agents"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("agent_id")) pm.collectionVariables.set("agent_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
