$kind: http-request
id: "095e0c60-8a62-580a-a61f-817a42dadec2"
description: |-
  The `create` operation of **message**.

  SDK: `client.Message().create({ agent_id: "example", text: "example" })`
url: "{{base}}/agents/:id/messages"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this message belongs to.
body:
  type: json
  content: |-
    {
      "replyTo": "00000000-0000-4000-8000-000000000000",
      "forward": "00000000-0000-4000-8000-000000000000",
      "channel": "example",
      "to": [
        "example"
      ],
      "cc": [
        "example"
      ],
      "subject": "example",
      "text": "example",
      "attachments": [
        {
          "id": "00000000-0000-4000-8000-000000000000"
        }
      ],
      "thread": "example",
      "client": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("message_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
