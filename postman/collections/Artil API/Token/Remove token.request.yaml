$kind: http-request
id: "2b6741a8-fa40-506d-8aa8-e47dfbb18eba"
description: |-
  The `remove` operation of **token**.

  SDK: `client.Token().remove({ agent_id: "example", id: "example_id" })`
url: "{{base}}/agents/:id/tokens/:tokenId"
method: DELETE
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this token belongs to.
  - key: tokenId
    value: "{{token_id}}"
    description: The token this request addresses.
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code < 300) {
        pm.collectionVariables.unset("token_id")
      }
    language: text/javascript
order: 2000
