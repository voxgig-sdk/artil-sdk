description: |-
  The `list` operation of **listed_teammate**.

  SDK: `client.ListedTeammate().list()`
url: "{{base}}/team"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("listed_teammate_id")) pm.collectionVariables.set("listed_teammate_id", String(at(rec, "id")))
      }
    language: text/javascript
