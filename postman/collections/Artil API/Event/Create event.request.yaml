$kind: http-request
id: "55d2e1b1-c6c6-5fd0-bdd1-6810dcc600a7"
description: |-
  The `create` operation of **event**.

  SDK: `client.Event().create({ agent_id: "example" })`
url: "{{base}}/agents/:id/url"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this event belongs to.
body:
  type: json
  content: |-
    {
      "text": "example",
      "thread": "example",
      "toThread": "example",
      "client": "example",
      "attachments": [
        {
          "id": "00000000-0000-4000-8000-000000000000"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("event_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 2000
