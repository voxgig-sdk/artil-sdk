$kind: http-request
id: "78022345-1486-58df-a913-17d78f5bd506"
description: |-
  The `create` operation of **address**.

  SDK: `client.Address().create({ agent_id: "example", channel: "example" })`
url: "{{base}}/agents/:id/addresses"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this address belongs to.
body:
  type: json
  content: |-
    {
      "channel": "email",
      "value": "user@example.com",
      "country": "example",
      "token": "example",
      "setup": "00000000-0000-4000-8000-000000000000",
      "code": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("address_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 3000
