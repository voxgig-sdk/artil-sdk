  SDK: `client.Address().update({ agent_id: "example", id: "example", value: "example" })`
url: "{{base}}/agents/:id/addresses/:addressId"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this address belongs to.
  - key: addressId
    value: "{{address_id}}"
