$kind: http-request
id: "1522b2c3-3147-57ff-a62a-a0819c632806"
description: |-
  The `list` operation of **address**.

  SDK: `client.Address().list({ agent_id: "example" })`
url: "{{base}}/agents/:id/addresses"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this address belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("address_id")) pm.collectionVariables.set("address_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
