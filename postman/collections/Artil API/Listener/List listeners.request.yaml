$kind: http-request
id: f9a17fc3-ae97-51ae-b64f-71157ba68332
description: |-
  The `list` operation of **listener**.

  SDK: `client.Listener().list({ agent_id: "example" })`
url: "{{base}}/agents/:id/listeners"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this listener belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("listener_id")) pm.collectionVariables.set("listener_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
