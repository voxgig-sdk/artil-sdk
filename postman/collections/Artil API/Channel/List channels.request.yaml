$kind: http-request
id: "87943683-4a22-5aef-8865-289e9e1a6cbd"
description: |-
  The `list` operation of **channel**.

  SDK: `client.Channel().list({ agent_id: "example" })`
url: "{{base}}/agents/:id/channels"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this channel belongs to.
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = (body || [])[0]
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id") && !pm.collectionVariables.get("channel_id")) pm.collectionVariables.set("channel_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
