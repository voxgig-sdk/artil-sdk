$kind: http-request
id: ea3175fe-0e29-5eb0-a19a-15926cc80f59
description: |-
  The `create` operation of **address_setup**.

  SDK: `client.AddressSetup().create({ agent_id: "example", channel: "example" })`
url: "{{base}}/agents/:id/addresses/setups"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{agent_id}}"
    description: The agent this address_setup belongs to.
body:
  type: json
  content: |-
    {
      "channel": "email",
      "token": "example"
    }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json() } catch (e) { return null } })()
      const at = (rec, path) => path.split(".").reduce((n, k) => null == n ? n : n[k], rec)
      const rec = body
      if (pm.response.code < 300 && null != rec) {
        if (null != at(rec, "id")) pm.collectionVariables.set("address_setup_id", String(at(rec, "id")))
      }
    language: text/javascript
order: 1000
